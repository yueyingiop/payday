<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayDay Java 文件思维导图</title>
  <link rel="stylesheet" href="payday_java_mindmap.css">
  <script src="payday_java_mindmap_data.js"></script>
  <script src="payday_java_mindmap.js" defer></script>
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div>
          <h1 id="pageTitle">PayDay Java 文件思维导图</h1>
          <p id="pageSubtitle">正在加载源码关系数据</p>
        </div>
      </div>
      <span class="topbar-link">PayDay 源码结构</span>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <section class="panel">
          <div class="panel-heading">
            <h2>文件夹</h2>
            <p>点击目录切换关系图，箭头按钮展开下级</p>
          </div>
          <div id="folderList" class="tree"></div>
        </section>
        <section class="panel">
          <div class="panel-heading">
            <h2>系统</h2>
            <p>在当前页面切换系统内部关系</p>
          </div>
          <div id="systemList" class="system-list"></div>
        </section>
      </aside>
      <main class="panel canvas-panel">
        <div class="canvas-toolbar">
          <div id="breadcrumb" class="breadcrumb">正在加载</div>
          <div class="toolbar-actions"><button id="zoomOut" class="icon-button" type="button" title="缩小"
              aria-label="缩小">−</button><button id="resetView" class="icon-button" type="button" title="重置视图"
              aria-label="重置视图">1:1</button><button id="zoomIn" class="icon-button" type="button" title="放大"
              aria-label="放大">+</button></div>
        </div>
        <div class="map-wrap"><svg id="map" role="img" aria-label="当前目录的 PayDay Java 文件和子目录关系图"></svg></div>
        <div id="details" class="details">
          <p>正在加载数据...</p>
        </div>
      </main>
    </div>
  </div>
</body>

</html>
