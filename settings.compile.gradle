pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'org.gradle.toolchains.foojay-resolver-convention') {
                useModule('org.gradle.toolchains:foojay-resolver:0.7.0')
            }
            if (requested.id.id == 'net.minecraftforge.gradle') {
                useModule('net.minecraftforge.gradle:ForgeGradle:6.0.54')
            }
        }
    }
    repositories {
        gradlePluginPortal()
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    }
}

rootProject.name = 'payday'
